name: Release Artifacts

on:
  release:
    types: [published]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build; empty uses the selected ref and canonical version for a full release'
        required: false
        type: string
      full_release:
        description: 'Build and upload full release artifacts (CLI + libraries) in addition to benchmarks'
        required: false
        default: true
        type: boolean
      run_jmh:
        description: 'Run JMH benchmarks and upload benchmark artifacts'
        required: false
        default: true
        type: boolean
      run_jsonata:
        description: 'Run JSONata benchmarks and upload JSONata artifacts'
        required: false
        default: false
        type: boolean
      jsonata_jmh_profile:
        description: 'JSONata JMH profile'
        required: false
        default: 'representative-long'
        type: choice
        options:
          - representative-long
          - representative-smoke
          - representative
          - all
      jsonata_case_ids:
        description: 'Optional comma-separated JSONata case IDs; overrides jsonata_jmh_profile case selection'
        required: false
        type: string
      jsonata_warmup_iterations:
        description: 'Optional JSONata JMH warmup iterations override'
        required: false
        type: string
      jsonata_iterations:
        description: 'Optional JSONata JMH measurement iterations override'
        required: false
        type: string
      jsonata_time_on_iteration:
        description: 'Optional JSONata JMH time per measurement iteration override, for example 1s'
        required: false
        type: string
      jsonata_forks:
        description: 'Optional JSONata JMH forks override'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-artifacts
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    outputs:
      deploy_pages: ${{ steps.deploy_gate.outputs.deploy_pages }}
      build_sha: ${{ steps.release_context.outputs.build_sha }}
      release_version: ${{ steps.release_context.outputs.release_version }}
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message || '', '+performance') || contains(github.event.head_commit.message || '', '+jsonata')))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: playground/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve and validate release context
        id: release_context
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          DISPATCH_FULL_RELEASE: ${{ github.event.inputs.full_release }}
          DISPATCH_RUN_JMH: ${{ github.event.inputs.run_jmh }}
          DISPATCH_RUN_JSONATA: ${{ github.event.inputs.run_jsonata }}
          DISPATCH_JSONATA_JMH_PROFILE: ${{ github.event.inputs.jsonata_jmh_profile }}
          DISPATCH_JSONATA_CASE_IDS: ${{ github.event.inputs.jsonata_case_ids }}
          DISPATCH_JSONATA_WARMUP_ITERATIONS: ${{ github.event.inputs.jsonata_warmup_iterations }}
          DISPATCH_JSONATA_ITERATIONS: ${{ github.event.inputs.jsonata_iterations }}
          DISPATCH_JSONATA_TIME_ON_ITERATION: ${{ github.event.inputs.jsonata_time_on_iteration }}
          DISPATCH_JSONATA_FORKS: ${{ github.event.inputs.jsonata_forks }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          build_sha=$(git rev-parse HEAD)
          package_version=$(./gradlew --no-daemon -q printReleaseVersion)
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid package version: $package_version" >&2; exit 1; }
          echo "BUILD_SHA=$build_sha" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "build_sha=$build_sha" >> "$GITHUB_OUTPUT"
          echo "release_version=$package_version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
            run_full_release="true"
            run_jmh="true"
            run_jsonata="false"
            jsonata_jmh_profile="representative-long"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="perf-${GITHUB_SHA::7}"
            run_full_release="false"
            run_jmh="true"
            jsonata_jmh_profile="representative-long"
            if [[ "${HEAD_COMMIT_MESSAGE:-}" == *"+jsonata"* ]]; then
              run_jsonata="true"
            else
              run_jsonata="false"
            fi

          else
            # workflow_dispatch
            tag="${DISPATCH_TAG:-}"

            # inputs arrive as strings; default true
            fr="${DISPATCH_FULL_RELEASE:-true}"
            rj="${DISPATCH_RUN_JMH:-true}"
            rjta="${DISPATCH_RUN_JSONATA:-false}"
            jsonata_jmh_profile="${DISPATCH_JSONATA_JMH_PROFILE:-representative-long}"

            if [[ "$fr" == "false" ]]; then run_full_release="false"; else run_full_release="true"; fi
            if [[ "$rj" == "false" ]]; then run_jmh="false"; else run_jmh="true"; fi
            if [[ "$rjta" == "true" ]]; then run_jsonata="true"; else run_jsonata="false"; fi

          fi

          if [[ "$run_full_release" == "false" && "$run_jmh" == "false" && "$run_jsonata" == "false" ]]; then
            echo "Select at least one artifact or benchmark build" >&2; exit 1
          fi
          for value in "${DISPATCH_JSONATA_JMH_PROFILE:-}" "${DISPATCH_JSONATA_CASE_IDS:-}" "${DISPATCH_JSONATA_WARMUP_ITERATIONS:-}" "${DISPATCH_JSONATA_ITERATIONS:-}" "${DISPATCH_JSONATA_TIME_ON_ITERATION:-}" "${DISPATCH_JSONATA_FORKS:-}"; do
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo "Multiline workflow input is not supported" >&2; exit 1; }
          done
          if [[ -z "$tag" ]]; then
            if [[ "$run_full_release" == "true" ]]; then tag="v$package_version"; else tag="snapshot-${build_sha::7}"; fi
          fi
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "Unsafe release tag: $tag" >&2; exit 1; }
          if [[ "$run_full_release" == "true" && "$tag" != "v$package_version" ]]; then
            echo "Release tag $tag does not match package version v$package_version" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_sha=$(git rev-parse "refs/tags/$tag^{commit}")
            [[ "$tag_sha" == "$build_sha" ]] || { echo "Tag $tag resolves to $tag_sha, checkout is $build_sha" >&2; exit 1; }
          fi
          prerelease=true
          if [[ "$run_full_release" == "true" && "$package_version" != *-* ]]; then prerelease=false; fi
          echo "RELEASE_PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "Building $tag, package $package_version, commit $build_sha"

          echo "TAG_NAME=$tag" >> "$GITHUB_ENV"
          echo "RUN_FULL_RELEASE=$run_full_release" >> "$GITHUB_ENV"
          echo "RUN_JMH=$run_jmh" >> "$GITHUB_ENV"
          echo "RUN_JSONATA=$run_jsonata" >> "$GITHUB_ENV"
          echo "JSONATA_JMH_PROFILE=$jsonata_jmh_profile" >> "$GITHUB_ENV"
          echo "JSONATA_CASE_IDS=${DISPATCH_JSONATA_CASE_IDS:-}" >> "$GITHUB_ENV"
          echo "JSONATA_WARMUP_ITERATIONS=${DISPATCH_JSONATA_WARMUP_ITERATIONS:-}" >> "$GITHUB_ENV"
          echo "JSONATA_ITERATIONS=${DISPATCH_JSONATA_ITERATIONS:-}" >> "$GITHUB_ENV"
          echo "JSONATA_TIME_ON_ITERATION=${DISPATCH_JSONATA_TIME_ON_ITERATION:-}" >> "$GITHUB_ENV"
          echo "JSONATA_FORKS=${DISPATCH_JSONATA_FORKS:-}" >> "$GITHUB_ENV"

      - name: Decide whether to deploy pages
        id: deploy_gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUN_FULL_RELEASE}" == "true" || "${RUN_JMH}" == "true" || "${RUN_JSONATA}" == "true" ]]; then
            echo "deploy_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_pages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build JS CLI tarball
        if: env.RUN_FULL_RELEASE == 'true'
        run: ./gradlew --no-daemon :cli:packageJsCli

      - name: List JS CLI artifacts
        if: env.RUN_FULL_RELEASE == 'true'
        run: ls -alh cli/build/distributions || true

      - name: Build JVM fat jar
        if: env.RUN_FULL_RELEASE == 'true'
        run: ./gradlew --no-daemon :cli:blShadowJar

      - name: List JVM CLI artifacts
        if: env.RUN_FULL_RELEASE == 'true'
        run: ls -alh cli/build/libs || true

      - name: Build library artifacts (JVM + interpreter JS)
        if: env.RUN_FULL_RELEASE == 'true'
        run: ./gradlew --no-daemon :interpreter:jvmJar :vm:jvmJar :interpreter:packageInterpreterJs

      - name: Download JSONata engine jars
        if: env.RUN_JSONATA == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dashjoin_version="0.9.8"
          ibm_version="2.5.5"
          base_dir="$GITHUB_WORKSPACE/build/jsonata-jars"
          dashjoin_dir="$base_dir/dashjoin"
          ibm_dir="$base_dir/ibm"
          mkdir -p "$dashjoin_dir" "$ibm_dir"
          curl -sSL -o "$dashjoin_dir/jsonata-${dashjoin_version}.jar" \
            "https://repo1.maven.org/maven2/com/dashjoin/jsonata/${dashjoin_version}/jsonata-${dashjoin_version}.jar"
          curl -sSL -o "$ibm_dir/JSONata4Java-${ibm_version}.jar" \
            "https://repo1.maven.org/maven2/com/ibm/jsonata4java/JSONata4Java/${ibm_version}/JSONata4Java-${ibm_version}.jar"
          echo "DASHJOIN_REPO=$dashjoin_dir" >> "$GITHUB_ENV"
          echo "IBM_JSONATA_REPO=$ibm_dir" >> "$GITHUB_ENV"

      - name: Run JMH benchmarks
        if: env.RUN_JMH == 'true'
        run: ./gradlew --no-daemon :interpreter-benchmarks:jmh :vm-benchmarks:jmh

      - name: Build JMH summary
        if: env.RUN_JMH == 'true'
        run: |
          ./gradlew --no-daemon :cli:runBl --args "$GITHUB_WORKSPACE/.github/scripts/jmh-report.bl --shared-file jmh=$GITHUB_WORKSPACE/interpreter-benchmarks/build/results/jmh/results.json --shared-file jmh=$GITHUB_WORKSPACE/vm-benchmarks/build/results/jmh/results.json --shared-format json --shared-key relative --write-output --write-output-dir $GITHUB_WORKSPACE/build/benchmarks --output-format json-compact"

      - name: Run JSONata benchmarks
        if: env.RUN_JSONATA == 'true'
        env:
          JSONATA_TEST_SUITE_ROOT: ${{ github.workspace }}/jsonata-benchmarks/src/jmh/resources/jsonata-test-suite
        shell: bash
        run: |
          set -euo pipefail
          args=(--no-daemon :jsonata-benchmarks:jmh)
          if [[ -n "${JSONATA_JMH_PROFILE:-}" ]]; then
            args+=("-PjmhProfile=${JSONATA_JMH_PROFILE}")
          fi
          if [[ -n "${JSONATA_CASE_IDS:-}" ]]; then
            args+=("-PjmhCaseIds=${JSONATA_CASE_IDS}")
          fi
          if [[ -n "${JSONATA_WARMUP_ITERATIONS:-}" ]]; then
            args+=("-PjmhWarmupIterations=${JSONATA_WARMUP_ITERATIONS}")
          fi
          if [[ -n "${JSONATA_ITERATIONS:-}" ]]; then
            args+=("-PjmhIterations=${JSONATA_ITERATIONS}")
          fi
          if [[ -n "${JSONATA_TIME_ON_ITERATION:-}" ]]; then
            args+=("-PjmhTimeOnIteration=${JSONATA_TIME_ON_ITERATION}")
          fi
          if [[ -n "${JSONATA_FORKS:-}" ]]; then
            args+=("-PjmhForks=${JSONATA_FORKS}")
          fi
          ./gradlew "${args[@]}"

      - name: Build JSONata summary
        if: env.RUN_JSONATA == 'true'
        run: |
          test -s "$GITHUB_WORKSPACE/jsonata-benchmarks/build/reports/jsonata-benchmarks/state-report.json"
          ./gradlew --no-daemon :cli:runBl --args "$GITHUB_WORKSPACE/.github/scripts/jsonata-report.bl --shared-file jmh=$GITHUB_WORKSPACE/jsonata-benchmarks/build/results/jmh/results.json --shared-file state=$GITHUB_WORKSPACE/jsonata-benchmarks/build/reports/jsonata-benchmarks/state-report.json --shared-format json --shared-key basename --write-output --write-output-dir $GITHUB_WORKSPACE/build/jsonata-benchmarks --output-format json-compact"

      - name: List artifacts
        run: |
          ls -alh interpreter/build/libs || true
          ls -alh interpreter/build/distributions || true
          ls -alh vm/build/libs || true
          ls -alh build/benchmarks || true
          ls -alh build/jsonata-benchmarks || true

      - name: Validate and capture versioned release artifacts
        if: env.RUN_FULL_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          upload_dir="$GITHUB_WORKSPACE/build/release-upload"
          mkdir -p "$upload_dir"
          capture() {
            local source="$1" target="$2" variable="$3"
            [[ -s "$source" ]] || { echo "Missing exact-version artifact: $source" >&2; exit 1; }
            cp "$source" "$upload_dir/$target"
            echo "$variable=$upload_dir/$target" >> "$GITHUB_ENV"
          }
          capture "cli/build/distributions/branchline-cli-js-${PACKAGE_VERSION}.tgz" "branchline-cli-js-${TAG_NAME}.tgz" JS_TARBALL_PATH
          capture "cli/build/libs/branchline-cli-${PACKAGE_VERSION}-all.jar" "branchline-cli-${TAG_NAME}-all.jar" JVM_JAR_PATH
          capture "interpreter/build/libs/interpreter-jvm-${PACKAGE_VERSION}.jar" "branchline-interpreter-${TAG_NAME}-jvm.jar" INTERPRETER_JVM_PATH
          capture "vm/build/libs/vm-jvm-${PACKAGE_VERSION}.jar" "branchline-vm-${TAG_NAME}-jvm.jar" VM_JVM_PATH
          capture "interpreter/build/distributions/branchline-interpreter-${PACKAGE_VERSION}-js.tgz" "branchline-interpreter-${TAG_NAME}-js.tgz" INTERPRETER_JS_PATH
          actual_jvm=$(java -jar "cli/build/libs/branchline-cli-${PACKAGE_VERSION}-all.jar" --version)
          actual_node=$(node cli/build/cliJsPackage/bin/bl.cjs --version)
          [[ "$actual_jvm" == "Branchline CLI ${TAG_NAME}" && "$actual_node" == "$actual_jvm" ]] || { echo "CLI version mismatch: JVM=$actual_jvm Node=$actual_node" >&2; exit 1; }
          node -e 'const p=require("./cli/build/cliJsPackage/package.json"); if(p.version!==process.env.PACKAGE_VERSION) throw Error("npm version mismatch")'
          jq -n --arg version "$PACKAGE_VERSION" --arg tag "$TAG_NAME" --arg sha "$BUILD_SHA" '{version:$version,tag:$tag,sha:$sha}' > "$upload_dir/release-metadata.json"
          (cd "$upload_dir" && sha256sum *.jar *.tgz release-metadata.json > SHA256SUMS)

      - name: Capture JMH artifact paths
        if: env.RUN_JMH == 'true'
        shell: bash
        run: |
          set -euo pipefail

          INTERP_JMH_JSON="$GITHUB_WORKSPACE/interpreter-benchmarks/build/results/jmh/results.json"
          [ -f "$INTERP_JMH_JSON" ] || { echo "Interpreter JMH results not found at $INTERP_JMH_JSON" >&2; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/build/benchmarks"
          INTERP_JMH_UPLOAD="$GITHUB_WORKSPACE/build/benchmarks/branchline-jmh-interpreter-${TAG_NAME}.json"
          cp "$INTERP_JMH_JSON" "$INTERP_JMH_UPLOAD"
          echo "INTERPRETER_JMH_JSON_PATH=$INTERP_JMH_UPLOAD" >> "$GITHUB_ENV"

          VM_JMH_JSON="$GITHUB_WORKSPACE/vm-benchmarks/build/results/jmh/results.json"
          [ -f "$VM_JMH_JSON" ] || { echo "VM JMH results not found at $VM_JMH_JSON" >&2; exit 1; }
          VM_JMH_UPLOAD="$GITHUB_WORKSPACE/build/benchmarks/branchline-jmh-vm-${TAG_NAME}.json"
          cp "$VM_JMH_JSON" "$VM_JMH_UPLOAD"
          echo "VM_JMH_JSON_PATH=$VM_JMH_UPLOAD" >> "$GITHUB_ENV"

          JMH_SUMMARY_MD="$GITHUB_WORKSPACE/build/benchmarks/branchline-jmh-summary-${TAG_NAME}.md"
          SRC_MD="$GITHUB_WORKSPACE/build/benchmarks/jmh-summary.md"
          [ -f "$SRC_MD" ] || { echo "JMH summary markdown not found at $SRC_MD" >&2; exit 1; }
          cp "$SRC_MD" "$JMH_SUMMARY_MD"
          echo "JMH_SUMMARY_MD_PATH=$JMH_SUMMARY_MD" >> "$GITHUB_ENV"

          JMH_SUMMARY_CSV="$GITHUB_WORKSPACE/build/benchmarks/branchline-jmh-summary-${TAG_NAME}.csv"
          SRC_CSV="$GITHUB_WORKSPACE/build/benchmarks/jmh-summary.csv"
          [ -f "$SRC_CSV" ] || { echo "JMH summary CSV not found at $SRC_CSV" >&2; exit 1; }
          cp "$SRC_CSV" "$JMH_SUMMARY_CSV"
          echo "JMH_SUMMARY_CSV_PATH=$JMH_SUMMARY_CSV" >> "$GITHUB_ENV"

      - name: Capture JSONata artifact paths
        if: env.RUN_JSONATA == 'true'
        shell: bash
        run: |
          set -euo pipefail

          JSONATA_JMH_JSON="$GITHUB_WORKSPACE/jsonata-benchmarks/build/results/jmh/results.json"
          [ -f "$JSONATA_JMH_JSON" ] || { echo "JSONata JMH results not found at $JSONATA_JMH_JSON" >&2; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/build/jsonata-benchmarks"
          JSONATA_JMH_UPLOAD="$GITHUB_WORKSPACE/build/jsonata-benchmarks/branchline-jsonata-jmh-${TAG_NAME}.json"
          cp "$JSONATA_JMH_JSON" "$JSONATA_JMH_UPLOAD"
          echo "JSONATA_JMH_JSON_PATH=$JSONATA_JMH_UPLOAD" >> "$GITHUB_ENV"

          JSONATA_SUMMARY_MD="$GITHUB_WORKSPACE/build/jsonata-benchmarks/branchline-jsonata-summary-${TAG_NAME}.md"
          SRC_JSONATA_MD="$GITHUB_WORKSPACE/build/jsonata-benchmarks/jsonata-summary.md"
          [ -f "$SRC_JSONATA_MD" ] || { echo "JSONata summary markdown not found at $SRC_JSONATA_MD" >&2; exit 1; }
          cp "$SRC_JSONATA_MD" "$JSONATA_SUMMARY_MD"
          echo "JSONATA_SUMMARY_MD_PATH=$JSONATA_SUMMARY_MD" >> "$GITHUB_ENV"

          JSONATA_SUMMARY_CSV="$GITHUB_WORKSPACE/build/jsonata-benchmarks/branchline-jsonata-summary-${TAG_NAME}.csv"
          SRC_JSONATA_CSV="$GITHUB_WORKSPACE/build/jsonata-benchmarks/jsonata-summary.csv"
          [ -f "$SRC_JSONATA_CSV" ] || { echo "JSONata summary CSV not found at $SRC_JSONATA_CSV" >&2; exit 1; }
          cp "$SRC_JSONATA_CSV" "$JSONATA_SUMMARY_CSV"
          echo "JSONATA_SUMMARY_CSV_PATH=$JSONATA_SUMMARY_CSV" >> "$GITHUB_ENV"

      - name: Prepare release only after successful builds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Recheck the remote tag before uploading; never relabel another commit.
          remote_tag=$(git ls-remote --tags origin "refs/tags/$TAG_NAME")
          if [[ -n "$remote_tag" ]]; then
            git fetch origin "refs/tags/$TAG_NAME"
            [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$BUILD_SHA" ]] || { echo "Remote release tag moved away from built commit" >&2; exit 1; }
          fi
          if release=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish); then
            draft=$(jq -r .isDraft <<< "$release")
            if [[ -z "$remote_tag" ]]; then
              target=$(jq -r .targetCommitish <<< "$release")
              [[ "$draft" == "true" && "$target" == "$BUILD_SHA" ]] || { echo "Existing release has no tag bound to built commit" >&2; exit 1; }
            fi
            [[ "$(jq -r .isPrerelease <<< "$release")" == "$RELEASE_PRERELEASE" ]] || { echo "Release prerelease status disagrees with package version" >&2; exit 1; }
          else
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "$TAG_NAME" \
              --notes "Built from $BUILD_SHA; package version $PACKAGE_VERSION." \
              --target "$BUILD_SHA" --draft --prerelease="$RELEASE_PRERELEASE" --latest=false
            draft=true
          fi
          echo "PUBLISH_DRAFT=$draft" >> "$GITHUB_ENV"

      - name: Upload full release artifacts (gh; tag-based names)
        if: env.RUN_FULL_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release upload "$TAG_NAME" \
            "$JS_TARBALL_PATH#branchline-cli-js-${TAG_NAME}.tgz" \
            "$JVM_JAR_PATH#branchline-cli-${TAG_NAME}-all.jar" \
            "$INTERPRETER_JVM_PATH#branchline-interpreter-${TAG_NAME}-jvm.jar" \
            "$VM_JVM_PATH#branchline-vm-${TAG_NAME}-jvm.jar" \
            "$INTERPRETER_JS_PATH#branchline-interpreter-${TAG_NAME}-js.tgz" \
            "$GITHUB_WORKSPACE/build/release-upload/release-metadata.json" \
            "$GITHUB_WORKSPACE/build/release-upload/SHA256SUMS" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload JMH artifacts (gh; optional)
        if: env.RUN_JMH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release upload "$TAG_NAME" \
            "$INTERPRETER_JMH_JSON_PATH#branchline-jmh-interpreter-${TAG_NAME}.json" \
            "$VM_JMH_JSON_PATH#branchline-jmh-vm-${TAG_NAME}.json" \
            "$JMH_SUMMARY_MD_PATH#branchline-jmh-summary-${TAG_NAME}.md" \
            "$JMH_SUMMARY_CSV_PATH#branchline-jmh-summary-${TAG_NAME}.csv" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload JSONata artifacts (gh; optional)
        if: env.RUN_JSONATA == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release upload "$TAG_NAME" \
            "$JSONATA_JMH_JSON_PATH#branchline-jsonata-jmh-${TAG_NAME}.json" \
            "$JSONATA_SUMMARY_MD_PATH#branchline-jsonata-summary-${TAG_NAME}.md" \
            "$JSONATA_SUMMARY_CSV_PATH#branchline-jsonata-summary-${TAG_NAME}.csv" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish completed draft release
        if: env.PUBLISH_DRAFT == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$RELEASE_PRERELEASE" --latest=false

  deploy-pages:
    needs: build-and-upload
    if: needs.build-and-upload.outputs.deploy_pages == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      ref: ${{ needs.build-and-upload.outputs.build_sha }}
      expected_version: ${{ needs.build-and-upload.outputs.release_version }}
    permissions:
      contents: read
      pages: write
      id-token: write
