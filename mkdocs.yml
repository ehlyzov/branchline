site_name: Branchline
site_url: https://ehlyzov.github.io/branchline/
site_description: Shape JSON into the data your service needs with Branchline.
site_author: Eugene Hlyzov
repo_name: ehlyzov/branchline
repo_url: https://github.com/ehlyzov/branchline

exclude_docs: |
  /includes/quick-install.md
  /includes/prepare-order/
  /includes/recipes/

theme:
  name: material
  font:
    text: "Source Serif 4"
    code: "Source Code Pro"
  palette:
    - scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Try it: playground.md
  - Get started: guides/getting-started.md
  - Recipes:
    - Choose a task: learn/recipes.md
    - Normalize a customer: recipes/recipe-customer.md
    - Prepare an order: recipes/prepare-order.md
    - Summarize sales: recipes/recipe-sales-summary.md
    - Handle incomplete data: recipes/recipe-incomplete-data.md
    - Summarize test results: recipes/recipe-test-report.md
    - Reject invalid input: recipes/recipe-pipeline-guard.md
    - All examples by task: guides/examples.md
  - Learn:
    - Tour of Branchline: learn/index.md
    - Hello, Transform: learn/hello-transform.md
    - Paths and Reshaping: learn/paths-and-reshaping.md
    - Control Flow for Pipelines: learn/control-flow.md
    - Error Handling and Tracing: learn/error-handling.md
    - Guides Index: guides/index.md
    - First Steps: guides/first-steps.md
    - FOR EACH Loops: guides/for-each.md
    - Array Comprehensions: guides/array-comprehension.md
    - TRY/CATCH: guides/try-catch.md
  - Reference:
    - Overview: language/index.md
    - Lexical Structure: language/lexical.md
    - Declarations: language/declarations.md
    - Statements: language/statements.md
    - Expressions: language/expressions.md
    - Numeric Semantics: language/numeric.md
    - Standard Library Support: language/stdlib-support.md
    - Grammar: language/grammar.md
    - Standard Library:
      - Core Functions: language/std-core.md
      - Array Operations: language/std-arrays.md
      - Aggregation: language/std-agg.md
      - Higher-order Functions: language/std-hof.md
      - Strings: language/std-strings.md
      - Time Functions: language/std-time.md
      - Debug Utilities: language/std-debug.md
  - Run & integrate:
    - Install Branchline: guides/install.md
    - Platform Support: guides/platform-support.md
    - Branchline CLI: guides/cli.md
    - Production Use: guides/production-use.md
    - Operational Pilot: guides/pilot-plan.md
    - Migration Guides: guides/migrations.md
    - Release Readiness & Stability: guides/release-readiness.md
    - API Support: guides/api-support.md
  - Advanced:
    - VM Overview: vm.md
    - Benchmarks:
      - Overview: benchmarks.md
      - Latest: benchmarks/latest.md
      - Releases: benchmarks/releases/index.md
      - Release List: benchmarks/releases/list.md
      - JSONata Benchmarks: benchmarks/jsonata.md
      - JSONata Releases: benchmarks/jsonata/releases/index.md

plugins:
  - search
  - autorefs

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ehlyzov/branchline
